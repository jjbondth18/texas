<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Texas Admin</title><link rel="stylesheet" href="/app.css"></head>
<body><div id="login" class="login"><form id="loginForm"><h1>Texas Admin</h1><p>仅供项目所有者本机使用</p><input id="pin" type="password" minlength="6" placeholder="Admin PIN" required autofocus><button>进入后台</button><small id="loginError"></small></form></div>
<div id="app" hidden><aside><div class="brand">TEXAS <b>ADMIN</b></div><nav></nav><button id="backup">创建数据库备份</button></aside><main><header><div><h1 id="title">Dashboard</h1><p id="subtitle">本地游戏运营控制台</p></div><span class="local">● 127.0.0.1 ONLY</span></header><section id="content"></section></main></div>
<dialog id="actionDialog"><form method="dialog" id="actionForm"><h2 id="actionTitle"></h2><input id="actionValue" type="number"><textarea id="actionReason" placeholder="操作原因（必填，至少 3 字符）" required minlength="3"></textarea><div class="warning">此操作会立即写入数据库，并产生钱包流水与管理员审计记录。</div><label class="confirm"><input id="confirmCheck" type="checkbox" required> 我已核对目标玩家和变动数值</label><div class="buttons"><button value="cancel" class="ghost">取消</button><button id="actionSubmit" value="default">确认执行</button></div></form></dialog>
<script src="/app.js"></script></body></html>
